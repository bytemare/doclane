name: Lint

on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Pin to immutable SHAs in production repositories.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0
      - name: Run golangci-lint
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        run: |
          set -euo pipefail
          golangci_lint_bin="$(go env GOPATH)/bin/golangci-lint"
          "$golangci_lint_bin" run ./cmd/... ./internal/...
