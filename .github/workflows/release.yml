name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.0"

      - name: Verify release tag context
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v ]]
          git rev-parse --verify "refs/tags/${tag}" >/dev/null
          tag_commit="$(git rev-list -n1 "$tag")"
          head_commit="$(git rev-parse HEAD)"
          [[ "$tag_commit" == "$head_commit" ]]

      - name: Build Doclane from source (runtime path sanity check)
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOWORK=off go build -trimpath -mod=readonly -o "$RUNNER_TEMP/doclane" ./cmd/doclane
          "$RUNNER_TEMP/doclane" --help >/dev/null

      - name: Generate release metadata and notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          doclane_go_version="$(go env GOVERSION)"
          export DOCLANE_GO_VERSION="$doclane_go_version"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          metadata = {
              "project": "doclane",
              "tag": tag,
              "commit_sha": os.environ["GITHUB_SHA"],
              "repository": repo,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": run_id,
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_run_url": f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{run_id}",
              "released_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "go_version": os.environ["DOCLANE_GO_VERSION"],
              "action_runtime_build": True,
              "distribution_model": "github-action-runtime-build",
          }
          Path("dist/release-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          cat > dist/release-notes.md <<EOF
          Doclane source release ${GITHUB_REF_NAME}

          Security/runtime model
          - Consumers should pin the Doclane action by immutable commit SHA.
          - The composite action builds \`doclane\` from source at the pinned action commit.
          - This release publishes source-level metadata, not standalone CLI binaries.

          Release details
          - Commit: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file dist/release-notes.md
            gh release upload "$tag" --clobber dist/release-metadata.json
          else
            gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes-file dist/release-notes.md \
              dist/release-metadata.json
          fi

      - name: Generate provenance attestation for release metadata
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/release-metadata.json
