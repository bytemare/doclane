version: 1

source:
  repo: org/shared-docs
  selector: latest
  allow_latest: true
  enforce_signed_tags: true

policy:
  mode: enforce
  path: .doclane-policy.yml

sync:
  - id: code_of_conduct
    source: open-source/CODE_OF_CONDUCT.md
    target: docs/CODE_OF_CONDUCT.md

  - id: security_policy
    source: templates/SECURITY.md.tmpl
    target: SECURITY.md
    template:
      vars:
        project_name: Consumer Repo
        security_email: security@example.com
