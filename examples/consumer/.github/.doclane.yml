---
version: 1

source:
  repo: org/shared-docs
  selector: latest
  allow_latest: true
  enforce_signed_tags: true

policy:
  mode: enforce
  path: .doclane-policy.yml

sync:
  - id: code_of_conduct
    source: open-source/CODE_OF_CONDUCT.md
    target: docs/CODE_OF_CONDUCT.md

  - id: repo_overview
    source: templates/REPO_OVERVIEW.md.tmpl
    target: docs/REPO_OVERVIEW.md
    template:
      vars:
        repo_name: consumer-repo

  - id: security_block
    source: templates/SECURITY_BLOCK.md.tmpl
    target: docs/SECURITY_BLOCK.md
    template:
      vars:
        security_block: |
          Please report vulnerabilities to security@example.com.

          We will acknowledge receipt within 72 hours.
